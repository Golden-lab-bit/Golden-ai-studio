
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Golden AI Studio</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">

    <link rel="stylesheet" href="main.css">

    <script src="https://unpkg.com/typed.js@3.0.0/dist/typed.umd.js"
        defer></script>
    <script src="main.js" defer></script>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <a href="#" class="logo">Golden AI Studio</a>

        <nav class="navbar">
            <a href="#" style="--1:1" class="active">Home</a>
            <a href="#" style="--1:2">Image</a>
            <a href="#" style="--1:3">Video</a>
            <a href="#" style="--1:4">Voice</a>
            <a href="#" style="--1:5">Price</a>
        </nav>
    </header>

    <!-- Home Section -->
    <section class="home">
        <div class="home-content">
            <h2>Welcome To Golden AI Studio</h2>
            <h3><span class="text"></span></h3>
            <div class="home-sci"></div>
        </div>
    </section>

    <!-- AI Chatbot -->
    <div class="chat-container">

        <div class="chatbot-popup">
            <div class="chat-body">
                <div class="message bot-message">
                    <div class="message-text">
                        Hello! Welcome to Golden AI Studio.
                        How can I help you today?
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat Input -->
        <div class="chat-footer">
            <form action="#" class="chat-form">

                <textarea
                    placeholder="Ask Golden AI anything..."
                    class="message-input"
                    rows="1"
                ></textarea>

                <div class="chat-controls">

                    <button
                        type="button"
                        id="emoji-picker"
                        class="material-symbols-rounded"
                        aria-label="Emoji picker"
                    >sentiment_satisfied</button>

                    <div class="file-upload-wrapper">

                        <input
                            type="file"
                            accept="image/*"
                            id="file-input"
                            hidden
                        >

                        <img src="#" alt="Selected image preview"
                            id="file-preview" hidden>

                        <button
                            type="button"
                            id="file-upload"
                            class="material-symbols-rounded"
                            aria-label="Upload image"
                        >attach_file</button>

                        <button
                            type="button"
                            id="file-cancel"
                            class="material-symbols-rounded"
                            aria-label="Remove image"
                        >close</button>
                    </div>

                    <button
                        type="submit"
                        id="send-message"
                        class="material-symbols-rounded"
                        aria-label="Send message"
                    >arrow_upward</button>

                </div>
            </form>
        </div>
    </div>
</body>
</html>
