
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Golden AI Studio | Login</title>

    <link rel="stylesheet" href="register.css">

    <link
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
        rel="stylesheet">
</head>

<body>
    <div class="box">
        <span class="borderLine"></span>
        <form action="#" method="post">
            <h2>SignUp</h2>

            <div class="inputBox">
                <input
                    type="text"
                    name="fullname"
                    autocomplete="fullname"
                    required>
                <span>Full name</span>
                <i></i>
            </div>
            <div class="inputBox">
                <input
                    type="email"
                    name="email"
                    autocomplete="email"
                    required>
                <span>Email</span>
                <i></i>
            </div>

            <div class="inputBox">
                <input
                    type="password"
                    name="password"
                    autocomplete="current-password"
                    required>
                <span>Password</span>
                <i></i>
            </div>
            <div class="inputBox">
                <input
                    type="password"
                    name="password"
                    autocomplete="current-password"
                    required>
                <span>confirm</span>
                <i></i>
            </div>

            <div class="links">
                <a href="index.html">SignUp</a>
            </div>

            <input type="submit" value="Login">
        </form>
    </div>
</body>
</html>
