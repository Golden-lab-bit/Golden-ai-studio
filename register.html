
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Golden AI Studio | SignUp</title>

    <link rel="stylesheet" href="register.css">

    <link
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
        rel="stylesheet">
</head>

<body>
    <div class="box">
        <span class="borderLine"></span>

        <form id="registerForm">
            <h2>SignUp</h2>

            <div class="inputBox">
                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    autocomplete="name"
                    required>
                <span>Full name</span>
                <i></i>
            </div>

            <div class="inputBox">
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required>
                <span>Email</span>
                <i></i>
            </div>

            <div class="inputBox">
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="new-password"
                    minlength="6"
                    required>
                <span>Password</span>
                <i></i>
            </div>

            <div class="inputBox">
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    autocomplete="new-password"
                    minlength="6"
                    required>
                <span>Confirm Password</span>
                <i></i>
            </div>

            <p id="message" role="status" aria-live="polite"></p>

            <div class="links">
                <a href="index.html">Already have an account? Login</a>
            </div>

            <input type="submit" value="SignUp">
        </form>
    </div>

    <script type="module" src="register.js"></script>
</body>
</html>
