<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Golden Ai Studio</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
        <!-- Wurin da aka saka link na Google Material Symbols -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
        <link rel="stylesheet" href="main.css">
        <script src="https://unpkg.com/typed.js@3.0.0/dist/typed.umd.js"></script>
    </head>
    <body>
        <header class="header">
            <a href="#" class="logo">Golden Ai Studio</a>
            <nav class="navbar">
                <a href="#" style="--1:1" class="active">Home</a>
                <a href="#" style="--1:2">Image</a>
                <a href="#" style="--1:3">Video</a>
                <a href="#" style="--1:4">Voice</a>
                <a href="#" style="--1:5">Price</a>
            </nav>
        </header>
        <section class="home">
            <div class="home-content">
                <h2>Welcome To Golden Ai Studio</h2>
                <h3> <span class="text"></span></h3>
                <div class="home-sci"></div>
            </div>
        </section>
        <div class="chat-container">
            <div class="chatbot-popup">
                <!-- chat-body -->
                <div class="chat-body">
                    <div class="message bot-message">
                        <div class="message-text">Hi! How can I help you today?</div>
                    </div>
                </div>
            </div>

            <!-- Semd Message Form -->
            <form action="#" class="chat-form">
                <textarea placeholder="Paste a prompt" class="message-input" required></textarea>
                <div class="chat-controls">
                    <button type="button" id="emoji-picker" class="material-symbols-rounded">sentiment_satisfied</button>
                    <div class="file-upload-wrapper">
                        <input type="file" accept="image/*" id="file-input" hidden>
                        <img src="#">
                        <button type="button" id="file-upload" class="material-symbols-rounded">attach_file</button>
                        <button type="button" id="file-cancel" class="material-symbols-rounded">close</button>
                    </div>
                    <button type="submit" id="send-message" class="material-symbols-rounded">arrow_upward</button>
                </div>
            </form>
        </div>
        <script src="main.js"></script>
    </body>
</html>
